<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剪辑台</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #faf9f7;
        color: #1a1916;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #editor {
        position: absolute;
        inset: 0;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      #banner {
        position: absolute;
        top: 8px;
        left: 50%;
        z-index: 2147483600;
        max-width: calc(100% - 32px);
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 6px;
        background: var(--vibedev-editor-elevated, #fffefc);
        color: var(--vibedev-editor-danger, #dc2626);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
      }
      .consent {
        position: fixed;
        inset: 0;
        z-index: 2147483601;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.32);
      }
      .consent-card {
        box-sizing: border-box;
        width: min(420px, 100%);
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 18px 20px;
        border: 1px solid var(--vibedev-editor-border, #e4e1db);
        border-radius: 10px;
        background: var(--vibedev-editor-elevated, #fffefc);
        color: var(--vibedev-editor-text, #1a1916);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.24);
      }
      .consent-card h2 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 600;
      }
      .consent-lead {
        margin: 0 0 12px;
      }
      .consent-facts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        margin: 0 0 12px;
      }
      .consent-facts dt {
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      .consent-facts dd {
        min-width: 0;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .consent-facts a {
        color: var(--vibedev-editor-accent, #d77757);
      }
      .consent-note {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      .consent-group {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 0 0 12px;
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      .consent-group input {
        margin: 3px 0 0;
        accent-color: var(--vibedev-editor-accent, #d77757);
      }
      .consent-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .consent-actions button {
        padding: 5px 14px;
        border: 1px solid var(--vibedev-editor-border, #e4e1db);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .consent-actions button.primary {
        border-color: var(--vibedev-editor-accent, #d77757);
        background: var(--vibedev-editor-accent, #d77757);
        color: #fff;
      }
      .consent-actions button:focus-visible {
        outline: 2px solid var(--vibedev-editor-accent, #d77757);
        outline-offset: 2px;
      }
      .caption-engines {
        display: grid;
        gap: 8px;
        margin: 0 0 12px;
      }
      .caption-engine {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px 10px;
        border: 1px solid var(--vibedev-editor-border, #e4e1db);
        border-radius: 8px;
        cursor: pointer;
      }
      .caption-engine:has(input:checked) {
        border-color: var(--vibedev-editor-accent, #d77757);
      }
      .caption-engine:has(input:disabled) {
        cursor: default;
        opacity: 0.6;
      }
      .caption-engine input {
        margin: 3px 0 0;
        accent-color: var(--vibedev-editor-accent, #d77757);
      }
      .caption-cost {
        margin: 0 0 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--vibedev-editor-surface, #f3f1ed);
        font-size: 12px;
      }
      .caption-cost p {
        margin: 0;
      }
      .caption-cost p + p {
        margin-top: 4px;
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      .caption-alert {
        margin: 0 0 8px;
        color: var(--vibedev-editor-danger, #dc2626);
        overflow-wrap: anywhere;
      }
      .caption-alert button,
      .caption-task button,
      .caption-toggle {
        padding: 2px 10px;
        border: 1px solid var(--vibedev-editor-border, #e4e1db);
        border-radius: 6px;
        background: transparent;
        color: var(--vibedev-editor-text, #1a1916);
        font: inherit;
        cursor: pointer;
      }
      .caption-task button:disabled,
      .caption-toggle:disabled,
      .consent-actions button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .caption-panel {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 2147483590;
        box-sizing: border-box;
        width: min(360px, calc(100% - 32px));
        max-height: 40vh;
        overflow: auto;
        padding: 10px 12px;
        border: 1px solid var(--vibedev-editor-border, #e4e1db);
        border-radius: 10px;
        background: var(--vibedev-editor-elevated, #fffefc);
        color: var(--vibedev-editor-text, #1a1916);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      }
      .caption-panel-head {
        display: grid;
        gap: 2px;
        margin: 0 0 8px;
      }
      .caption-panel-head span {
        font-size: 12px;
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      .caption-task {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        align-items: center;
        padding: 6px 0;
        border-top: 1px solid var(--vibedev-editor-border, #e4e1db);
      }
      .caption-task time,
      .caption-task-engine {
        font-size: 12px;
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      .caption-task button {
        grid-column: 2;
        grid-row: 1 / span 3;
      }
      .caption-review-card {
        width: min(560px, 100%);
      }
      .caption-rows {
        display: grid;
        gap: 2px;
        max-height: 46vh;
        margin: 0 0 10px;
        overflow: auto;
      }
      .caption-row {
        display: grid;
        grid-template-columns: 16px auto 1fr;
        gap: 8px;
        align-items: baseline;
        padding: 5px 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .caption-row[aria-pressed="true"] {
        border-color: var(--vibedev-editor-accent, #d77757);
      }
      .caption-row time,
      .caption-play {
        font-size: 12px;
        color: var(--vibedev-editor-text-muted, #74716b);
        font-variant-numeric: tabular-nums;
      }
      .caption-check {
        margin-top: 10px;
        color: var(--vibedev-editor-text, #1a1916);
      }
      .caption-row:focus-visible,
      .caption-task button:focus-visible,
      .caption-toggle:focus-visible {
        outline: 2px solid var(--vibedev-editor-accent, #d77757);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script type="module" src="./host.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <div id="status" role="status">正在打开剪辑台…</div>
    <div id="banner" role="alert" hidden></div>
  </body>
</html>

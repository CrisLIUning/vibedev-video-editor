<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剪辑台</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #faf9f7;
        color: #1a1916;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #editor {
        position: absolute;
        inset: 0;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        color: var(--vibedev-editor-text-muted, #74716b);
      }
      #banner {
        position: absolute;
        top: 8px;
        left: 50%;
        z-index: 2147483600;
        max-width: calc(100% - 32px);
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 6px;
        background: var(--vibedev-editor-elevated, #fffefc);
        color: var(--vibedev-editor-danger, #dc2626);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script type="module" src="./host.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <div id="status" role="status">正在打开剪辑台…</div>
    <div id="banner" role="alert" hidden></div>
  </body>
</html>
